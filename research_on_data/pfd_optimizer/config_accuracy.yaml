# Research grid for the direction/accuracy study (see README "Accuracy").
# It extends the spec with PFD score weights, trend filters and side selection.
walk_forward:
  n_folds: 5
  walk_forward_mode: rolling
  objective: sharpe
  min_trades: 5
  min_win_rate: 0.0

backtest:
  fee_bps: 16.0
  conservative_intrabar: true

params:
  interval_sec: [60, 180]
  window_size: [120, 360]
  sigma: [1.0, 1.5, 2.0, 2.5]
  price_source: [vwap]
  signal_mode: [momentum]
  confirm_intervals: [0, 1]
  trend_ema_span: [0, 120, 360]
  trend_filter_mode: [aligned, against]
  direction: [both, long, short]
  pz_weight: [1.0]
  intz_weight: [0.0, 0.5, 1.0]  # 0 = pure price momentum, 1 = original comb
  take_profit: [0.005, 0.0075, 0.01]
  stop_loss: [0.005, 0.0075, 0.01]
  max_hold_sec: [7200, 14400]

# Best config from the expectancy + risk-constrained search (6-24h).
# Objective: expectancy; constraints: PF >= 1.2, maxDD <= 2%, >= 20 test trades.
walk_forward:
  n_folds: 5
  walk_forward_mode: rolling
  objective: expectancy
  train_days: 6
  test_days: 6
  # Fixed-config evaluation: constraints are disabled so that all folds are
  # reported. The search-time constraints are in config_expectancy.yaml.
  min_trades: 0
  min_win_rate: 0.0
  min_profit_factor: 0.0
  max_drawdown_pct: null
  min_expectancy_pct: null
  min_total_trades: 0

backtest:
  fee_bps: 16.0
  conservative_intrabar: true

params:
  interval_sec: [60]
  window_size: [120]
  sigma: [3.0]
  price_source: [vwap]
  signal_mode: [momentum]
  confirm_intervals: [1]
  trend_ema_span: [0]
  trend_filter_mode: [aligned]
  direction: [both]
  pz_weight: [1.0]
  intz_weight: [1.0]
  trend_strength_min: [0.0]
  autocorr_window: [0]
  autocorr_mode: [follow]
  autocorr_threshold: [0.0]
  vol_window: [720]
  vol_ratio_min: [0.8]
  vol_ratio_max: [1000000000.0]
  take_profit: [0.02]
  stop_loss: [0.005]
  max_hold_sec: [86400]

# Full grid search (default spec).
walk_forward:
  n_folds: 7
  walk_forward_mode: rolling   # expanding or rolling
  objective: sharpe            # sharpe, profit_factor, net_pnl, calmar
  # train_days: 5              # optional, default: total_days // (n_folds + 1)
  # test_days: 5
  min_trades: 5                # ignore configs with fewer train trades
  min_win_rate: 0.0

backtest:
  fee_bps: 16.0                # 0.16% per side (taker + slippage)
  conservative_intrabar: true  # same-second TP+SL -> SL first

params:
  interval_sec: [10, 20, 30, 60, 120, 180, 300]
  window_size: [30, 60, 120, 180, 360, 720]
  sigma: [1.0, 1.5, 2.0, 2.5, 3.0, 3.5]
  price_source: [vwap, close]
  take_profit: [0.005, 0.0075, 0.01]
  stop_loss: [0.0025, 0.005, 0.01]
  max_hold_sec: [1800, 3600, 7200, 14400]

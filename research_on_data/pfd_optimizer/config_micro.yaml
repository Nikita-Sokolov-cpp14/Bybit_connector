# One configuration, two folds: smoke test.
walk_forward:
  n_folds: 2
  walk_forward_mode: expanding
  objective: sharpe
  train_days: 3
  test_days: 2
  min_trades: 1
  min_win_rate: 0.0

backtest:
  fee_bps: 16.0
  conservative_intrabar: true

params:
  interval_sec: [60]
  window_size: [120]
  sigma: [2.0]
  price_source: [vwap]
  take_profit: [0.01]
  stop_loss: [0.005]
  max_hold_sec: [3600]

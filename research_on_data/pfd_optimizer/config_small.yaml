walk_forward:
  n_folds: 5
  walk_forward_mode: rolling  # expanding or rolling
  objective: net_pnl # sharpe_trades, profit_factor, net_pnl_pct, calmar


backtest:
  fee_bps: 16.0
  conservative_intrabar: true

params:
  interval_sec: [60, 180]
  window_size: [60, 120, 360]
  sigma: [1.5, 2.0, 2.5]
  price_source: [vwap]
  take_profit: [0.005]
  stop_loss: [0.005]
  max_hold_sec: [3600, 7200]
